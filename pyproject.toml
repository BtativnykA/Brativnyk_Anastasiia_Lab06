[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-importer-tested"
version = "0.1.0"
description = "Lab06: Automated testing with pytest"
requires-python = ">=3.11"
authors = [{ name = "Anastasiia Brativnyk" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/reliable_importer"]

[tool.coverage.report]
show_missing = true
fail_under = 80