[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-system"
version = "0.1.0"
description = "Lab06 — testing a student registry (pytest suite)"
requires-python = ">=3.11"
authors = [{ name = "Anastasiia Brativnyk" }]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests",
]

[tool.coverage.run]
branch = true
source = ["student_system"]

[tool.coverage.report]
show_missing = true
skip_covered = false